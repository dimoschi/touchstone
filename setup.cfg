# mutmut config. Its only supported locations are pyproject.toml and this file.
# pyproject.toml is deliberately not used: this repo is not a Python package,
# and adding one makes `uv run` treat the repo as a project and try to build it,
# which is how scripts/run-python-tests.sh invokes coverage and pytest here.
#
# source_paths must be set even to run `mutmut --help`: without it mutmut 3
# raises FileNotFoundError from _guess_source_paths() at import time.
#
# One entry per line, never comma-separated. mutmut's setup.cfg reader splits a
# list value on newlines only, so a comma form is read as one path of that
# literal name, matches no directory, and the run reports "0 files mutated"
# while still exiting 0 from generation.
#
# source_paths is not only "what to mutate": mutmut copies every entry into
# mutants/ and runs pytest there with --rootdir=. , so anything the suites need
# at import time has to be listed or it simply does not exist in that tree. That
# is why the test directory and conftest.py are here alongside the two source
# directories. An entry may be a single file, which is how conftest.py lands at
# the root of mutants/ where pytest picks it up; it resolves its own location
# from __file__, so there it puts the *mutated* hooks/ and lib/ on sys.path
# rather than the originals. Listing it under do_not_mutate keeps it copied
# verbatim, since a file mutmut declines to mutate is still copied.
[mutmut]
source_paths =
    hooks
    skills/crap-controlled-changes/lib
    skills/crap-controlled-changes/test/unit
    conftest.py

# Matched with fnmatch against the path as written, so a pattern needs a
# literal '/' to match a nested file and none to match one at a source-path
# root. Both spellings are listed for each: `**/conftest.py` alone silently
# missed the root conftest.py, which then got mutated, and mutmut's forced-fail
# self-check died importing it rather than reporting anything about the code.
do_not_mutate =
    conftest.py
    */conftest.py
    test_*.py
    */test_*.py
