name: Feature
description: Something the plugin should do and does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome, not the implementation. A run's triage phase reads the
        ticket as its specification and its plan phase decides how, against the code
        as it is today. A ticket that arrives with a design attached gets that design
        built whether or not it survives contact with the repo, and the planner stops
        being a planner.

        State a decision here only when it has actually been settled, and put it under
        constraints with the reason.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What goes wrong today, with evidence where there is any: a measurement, a run
        that behaved badly, a `file:line` showing the current behaviour.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: >
        What is true once this ships, in a sentence or two. Written so someone can
        tell whether it happened without reading the diff.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: >
        How anyone can tell it is done, including the boundaries: what must keep
        working, and what this must not turn into.
      placeholder: |
        - The check list comes from the repo, not from names hardcoded here.
        - No run marks a PR ready while a discovered check is red.
        - Discovery finding nothing is logged, not a halt.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints, or decisions already taken
      description: >
        Anything that bounds the design: a dependency that does not exist yet, an
        approach already ruled out and why, a decision already argued out elsewhere.
        Not a proposed implementation.
    validations:
      required: false
