name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    # Both, because the hooks are the part users install and they resolve paths
    # and symlinks differently: macOS reaches /tmp through /private, which is the
    # case that broke contributing-gate.py's transcript comparison.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The gates require bash 4.0 and refuse below it. GitHub's macOS image
      # resolves `env bash` to the 3.2 Apple ships, so without this the guard
      # correctly refuses and every gate reports "could not evaluate". Matching
      # the documented requirement here is the point: a macOS user installs the
      # same thing.
      - name: Modern bash
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
      - name: Hook test suites
        run: |
          bash -c 'echo "bash ${BASH_VERSION}"; [ "${BASH_VERSINFO[0]}" -ge 4 ]'
          bash scripts/run-hook-tests.sh

  go:
    # The skill's Go suites (crap-check.sh, deadcode-check.sh, mutation-check.sh)
    # have never run anywhere with a real toolchain. This job is that toolchain:
    # a suite that only skips locally for lack of `go` must go red here, not skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Configure git and a throwaway commit-signing key
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N "" -C ci@example.com -f "$HOME/.ssh/id_ed25519"
          echo "ci@example.com $(cat "$HOME/.ssh/id_ed25519.pub")" > "$HOME/.ssh/allowed_signers"
          git config --global gpg.ssh.allowedSignersFile "$HOME/.ssh/allowed_signers"
          echo "CRAP_SIGNING_KEY=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"
      - name: Go-dependent test suites
        run: bash scripts/run-go-tests.sh

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No machine-specific or private references
        run: bash scripts/check-no-private-refs.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax-check every shell script
        run: |
          status=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; status=1; }
          done < <(git ls-files '*.sh')
          exit $status

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Plugin manifests and workflow parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "json ok: $f"
          done
          # The workflow body uses top-level return, which the runtime supplies a
          # function wrapper for, so parse it the same way rather than as a module.
          node -e "
            const fs = require('fs'), vm = require('vm');
            const src = fs.readFileSync('workflows/deliver-pipeline.js', 'utf8');
            vm.compileFunction('(async()=>{' + src.replace(/^export const meta/m, 'const meta') + '})');
            console.log('workflow parses');
          "
